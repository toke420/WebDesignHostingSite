<!doctype html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pipeline | Pipeline CRM · WebTechPros concept</title>
<meta name="description" content="A focused CRM for small sales teams.">
<link rel="stylesheet" href="../shared/concept.css">
<link rel="stylesheet" href="site.css">
</head>
<body class="crm page-pipeline">
<div class="concept-bar"><span>WebTechPros design concept · sample business and data</span><a href="/#projects">← Back to WebTechPros</a></div>
<header class="site-header"><div class="head">
<a class="logo" href="index.html"><span aria-hidden="true">P</span>Pipeline</a>
<button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav">☰</button>
<nav id="nav" class="site-nav" aria-label="Main"><a href="index.html">◧ Dashboard</a><a href="contacts.html">☺ Contacts</a><a href="pipeline.html" aria-current="page">▤ Pipeline</a></nav>
<div class="me"><button class="btn small" data-new-contact>+ New contact</button><span class="avatar" title="Signed in as Alex (demo)">AK</span></div>
</div></header>
<main id="main">
<div class="page"><div class="page-head"><div><h1>Sales pipeline</h1><p class="muted">Drag deals between stages, or use the stage menu on each card.</p></div><p class="pipe-total" id="pipe-total"></p></div><div class="board" id="board"></div></div>
</main>
<footer class="site-footer"><p>Design concept · all people and companies are fictional · data stays in this browser. <button class="linkish" id="reset-data">Reset demo data</button></p></footer>
<dialog id="new-contact" aria-labelledby="nc-title"><form method="dialog" id="nc-form" novalidate><h2 id="nc-title">New contact</h2>
<label>Name<input name="name" required></label><label>Company<input name="company" required></label><label>Email<input type="email" name="email" required></label>
<label>Deal value (AUD)<input type="number" name="value" min="0" step="100" value="5000"></label><label>Stage<select name="stage"><option>Lead</option><option>Qualified</option><option>Proposal</option><option>Won</option></select></label>
<div class="dlg-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" value="save">Save contact</button></div></form></dialog>
<script src="../shared/concept.js"></script>
<script src="site.js"></script>
</body>
</html>
